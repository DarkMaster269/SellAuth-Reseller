[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "resell-sellauth"
version = "0.1.0"
description = "Automated reselling for SellAuth stores"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ResellAuth Team" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pyyaml>=6.0.1",
    "curl_cffi>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-socket>=0.7.0",
    "ruff>=0.5.0",
    "httpx>=0.27.0",
]

[project.scripts]
resell = "resell.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["resell*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: marks tests that touch real supplier websites (read-only, opt-in)",
    "money: marks tests that spend real Litecoin (requires ALLOW_MONEY_TESTS=1)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["resell"]
